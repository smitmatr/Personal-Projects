services:
  - type: web
    name: alaska-draw-results-app
    runtime: python
    rootDir: "Visual Studio/Draw Results App"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 180"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
